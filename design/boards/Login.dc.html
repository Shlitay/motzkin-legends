<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Login – Prediction Legends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B6B3C}a:hover{color:#123F24}
.osw{font-family:Oswald,'Arial Narrow',sans-serif}
.goldtext{background:linear-gradient(135deg,#B8901F 0%,#E8C65A 28%,#FFF1B8 48%,#E2BD48 68%,#B8901F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center}
.stepnum{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Oswald,'Arial Narrow',sans-serif;font-size:16px;font-weight:700}
.steptxt{font-size:12px;font-weight:700;line-height:1.35;color:#3F4B43}
.float{position:relative;display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:14px;padding:7px 9px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.fsc{display:inline-flex;gap:4px;font-family:Oswald,'Arial Narrow',sans-serif;font-size:17px;font-weight:700;color:#17231C}
.fchip{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.fcrest{width:22px;height:22px;object-fit:contain}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #123F24; color: #17231C; font-family: Heebo, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- HERO -->
  <section style="position: relative; height: 392px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px; padding: 34px 0 0; box-sizing: border-box;">
    <svg aria-hidden="true" width="390" height="392" viewBox="0 0 390 392" style="position: absolute; inset: 0;">
      <g fill="none" stroke="#1B6B3C" stroke-width="1.6">
        <line x1="0" y1="196" x2="390" y2="196"></line>
        <circle cx="195" cy="196" r="96"></circle>
        <circle cx="195" cy="196" r="3" fill="#1B6B3C"></circle>
        <rect x="95" y="-2" width="200" height="62"></rect>
        <rect x="95" y="332" width="200" height="62"></rect>
      </g>
    </svg>


    <svg role="img" aria-label="Prediction Legends" width="108" height="108" viewBox="0 0 96 96" style="position: relative; direction: ltr;">
      <defs><linearGradient id="lgGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A47A14"></stop><stop offset=".35" stop-color="#F3D36B"></stop><stop offset=".5" stop-color="#FFF3C4"></stop><stop offset=".65" stop-color="#E0BB45"></stop><stop offset="1" stop-color="#A47A14"></stop></linearGradient></defs>
      <rect x="4" y="12" width="88" height="80" rx="20" fill="#0B2A17" stroke="url(#lgGold)" stroke-width="2.5"></rect>
      <rect x="14" y="30" width="28" height="48" rx="6" fill="#F7F3E3"></rect>
      <rect x="54" y="30" width="28" height="48" rx="6" fill="url(#lgGold)"></rect>
      <line x1="14" y1="54" x2="42" y2="54" stroke="#123F24" stroke-opacity=".25" stroke-width="1.5"></line>
      <line x1="54" y1="54" x2="82" y2="54" stroke="#123F24" stroke-opacity=".3" stroke-width="1.5"></line>
      <text x="28" y="67" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="32" fill="#123F24">2</text>
      <text x="68" y="67" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="32" fill="#2A2005">1</text>
      <circle cx="48" cy="46" r="2.8" fill="#F7F3E3"></circle>
      <circle cx="48" cy="62" r="2.8" fill="#F7F3E3"></circle>
      <path d="M33 21 L30.5 7.5 L40 13.5 L48 3.5 L56 13.5 L65.5 7.5 L63 21 Z" fill="url(#lgGold)" stroke="#123F24" stroke-width="2.5" stroke-linejoin="round"></path>
      <circle cx="30.5" cy="6" r="2.4" fill="url(#lgGold)" stroke="#123F24" stroke-width="1.5"></circle>
      <circle cx="48" cy="3" r="2.4" fill="url(#lgGold)" stroke="#123F24" stroke-width="1.5"></circle>
      <circle cx="65.5" cy="6" r="2.4" fill="url(#lgGold)" stroke="#123F24" stroke-width="1.5"></circle>
      <path d="M48 10.5 L48.85 12.83 L51.33 12.92 L49.38 14.45 L50.06 16.83 L48 15.45 L45.94 16.83 L46.62 14.45 L44.67 12.92 L47.15 12.83 Z" fill="#123F24"></path>
    </svg>
    <div dir="ltr" style="position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span class="osw goldtext" style="font-size: 15px; font-weight: 600; letter-spacing: .44em; padding-left: .44em;">PREDICTION</span>
      <span class="osw" style="font-size: 52px; font-weight: 700; letter-spacing: .03em; color: #F7F5EC;">LEGENDS</span>
    </div>
    <p style="position: relative; margin: 0; font-size: 15px; font-weight: 600; color: #F7F5EC; background: #0B2A17; border: 1px solid #2A5A3C; border-radius: 999px; padding: 5px 14px;">ליגת הניחושים של החבר׳ה</p>
    <div style="position: relative; display: flex; gap: 10px; margin-top: 8px;">
    <div class="float" style="transform: rotate(3deg);">
      <img class="fcrest" src="../assets/crests/hapoel-petah-tikva.png" alt="">
      <span class="fsc"><span>2</span><span style="color: #A3A39B;">:</span><span>0</span></span>
      <span class="fchip" style="background: linear-gradient(135deg, #B8901F 0%, #E8C65A 28%, #FFF1B8 48%, #E2BD48 68%, #B8901F 100%); color: #2A2005;">בול +10</span>
    </div>
    <div class="float" style="transform: rotate(-3deg);">
      <img class="fcrest" src="../assets/crests/hapoel-tel-aviv.png" alt="">
      <span class="fsc"><span>1</span><span style="color: #A3A39B;">:</span><span>3</span></span>
      <span class="fchip" style="background: #E6F2EA; color: #14512D;">כיוון + הפרש +6</span>
    </div>
    </div>
  </section>

  <!-- SHEET -->
  <section style="flex: 1; background: #F7F5EC; border-radius: 28px 28px 0 0; margin-top: -20px; position: relative; padding: 26px 22px 18px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: .14em; color: #55645A;">ברוכים הבאים</span>
      <h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 900; color: #123F24;">נחשו. תפגעו בול.<br><span class="goldtext" style="-webkit-text-stroke: .6px #8A6A12;">תהיו אגדה.</span></h1>
      <p style="margin: 0; font-size: 14px; color: #55645A;">11 משחקי ליגת העל בכל מחזור, קופה אחת לזוכה.</p>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 4px;">
      <div class="step"><span class="stepnum" style="background: #123F24; color: #F7F5EC;">1</span><span class="steptxt">מתחברים<br>עם Google</span></div>
      <svg aria-hidden="true" width="18" height="34" viewBox="0 0 18 34" style="flex-shrink: 0;"><path d="M12 11l-5 6 5 6" fill="none" stroke="#B9C2BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div class="step"><span class="stepnum" style="background: #1B6B3C; color: #FFFFFF;">2</span><span class="steptxt">מנחשים<br>11 משחקים</span></div>
      <svg aria-hidden="true" width="18" height="34" viewBox="0 0 18 34" style="flex-shrink: 0;"><path d="M12 11l-5 6 5 6" fill="none" stroke="#B9C2BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div class="step"><span class="stepnum" style="background: linear-gradient(135deg, #B8901F 0%, #E8C65A 28%, #FFF1B8 48%, #E2BD48 68%, #B8901F 100%); color: #2A2005;">3</span><span class="steptxt">שולחים ‎20 ש״ח<br>ונכנסים לקופה</span></div>
    </div>

    <button type="button" style="height: 54px; border-radius: 999px; border: 1.5px solid #D9DAD3; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; color: #17231C; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 6px rgba(17,17,17,.08);">
      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #D9DAD3; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; color: #3F4440;">G</span>
      המשך עם Google
    </button>

    <div style="margin-top: auto; display: flex; justify-content: center; gap: 18px; font-size: 12px;">
      <a href="#" style="color: #55645A; min-height: 32px; display: inline-flex; align-items: center;">מנהל/ת המשחק? התחברו כאן</a>
      <a href="#" style="color: #55645A; min-height: 32px; display: inline-flex; align-items: center;">מדיניות פרטיות</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
