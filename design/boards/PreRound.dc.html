<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Before the round</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B6B3C}a:hover{color:#123F24}
.card{width:100%;box-sizing:border-box;background:#FFFFFF;border:1px solid #E3E3DC;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(17,17,17,.05)}
.meta{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.when{font-size:12px;font-weight:500;color:#55645A}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:14px 12px 14px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px}
.crest{width:40px;height:40px;object-fit:contain}
.tname{font-size:13px;font-weight:700;white-space:nowrap}
.center{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:124px}
.score{display:flex;align-items:center;gap:10px;font-family:Oswald,'Arial Narrow',sans-serif;font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.colon{font-size:26px;font-weight:500;color:#A3A39B}
.pick{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#55645A}
.pickn{display:inline-flex;align-items:center;gap:5px;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:600;font-size:14px;color:#17231C;background:#F1F1EC;border-radius:6px;padding:1px 8px}
.inputs{display:flex;align-items:center;gap:8px}
.sbox{width:46px;height:52px;box-sizing:border-box;border-radius:10px;text-align:center;font-family:Oswald,'Arial Narrow',sans-serif;font-size:26px;font-weight:700;color:#17231C;outline:none}
.sbox::placeholder{color:#C9C3A8}
.caption{font-size:12px;font-weight:600;color:#55645A}
.strip{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;min-height:44px;box-sizing:border-box;font-size:13px;font-weight:700}
.olabel{display:inline-flex;align-items:center;gap:6px}
.pts{display:inline-flex;align-items:baseline;gap:5px}
.ptsn{font-family:Oswald,'Arial Narrow',sans-serif;font-size:22px;font-weight:700;line-height:1}
.ptsc{font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
@keyframes pl-pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pl-pulse 1.4s ease-in-out infinite}
.day{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#3F4B43}
.day::after{content:"";flex:1;height:1px;background:#E3E3DC}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;text-decoration:none;min-width:64px;min-height:44px;justify-content:center}
.paths{margin:0 12px 10px;border:1px solid #ECECE6;border-radius:12px;background:#FAFAF7;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.pathshead{font-size:11px;font-weight:800;color:#55645A}
.path{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:#17231C}
.pathwho{display:inline-flex;align-items:center;gap:6px}
.mini{width:18px;height:18px;object-fit:contain}
.pathres{display:inline-flex;align-items:center;gap:7px}
.psc{display:inline-flex;gap:3px;font-family:Oswald,'Arial Narrow',sans-serif;font-weight:600;font-size:13px}
.chip{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.fab{position:absolute;left:16px;bottom:84px;display:flex;align-items:center;gap:7px;height:40px;box-sizing:border-box;padding:0 12px 0 9px;border-radius:999px;border:1.5px solid transparent;font:inherit;cursor:pointer;flex-shrink:0;box-shadow:0 7px 18px rgba(11,42,23,.3)}
.fab::after{content:"";position:absolute;inset:-4px}
.fabic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fablbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.fabcap{font-size:9px;font-weight:800}
.fabt{font-family:Oswald,'Arial Narrow',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em}
</style>
</helmet>

  <section style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px;">

        <span class="olabel"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>הניחוש נשמר</span>
        <span class="ptsc">אפשר לשנות עד הפתיחה</span>
      </div>
    </article>

    <!-- empty -->
    <article class="card">
      <div class="meta">
        <span class="pill" style="background: #EFEFEA; color: #55645A;"><span class="dot" style="background: #8E918A;"></span>טרם החל</span>
        <span class="when">21:00</span>
      </div>
      <div class="row">
        <div class="team"><img class="crest" src="../assets/crests/hapoel-jerusalem.png" alt=""><span class="tname">הפועל י־ם</span></div>
        <div class="center">
          <div class="inputs">
            <input class="sbox" inputmode="numeric" maxlength="1" placeholder="–" aria-label="שערים להפועל ירושלים" style="border: 2px dashed #C9A227; background: #FFFDF5;">

            <input class="sbox" inputmode="numeric" maxlength="1" placeholder="–" aria-label="שערים למכבי נתניה" style="border: 2px dashed #C9A227; background: #FFFDF5;">

  <!-- floating countdown: shown only until the round's first kickoff -->

<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["days","hours","minutes"],"default":"days"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: this.startFor(props.stage), stage: props.stage };
  }
  startFor(stage) {
    if (stage === 'minutes') return 12 * 60 + 33;
    if (stage === 'hours') return 4 * 3600 + 12 * 60 + 33;
    return 2 * 86400 + 4 * 3600 + 12 * 60 + 33;
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.props.stage !== this.state.stage) {
        this.setState({ left: this.startFor(this.props.stage), stage: this.props.stage });
        return;
      }
      this.setState({ left: Math.max(0, this.state.left - 1) });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const t = this.state.left;
    const p = (n) => String(n).padStart(2, '0');
    const d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const hrs = Math.floor(t / 3600);
    const label = p(hrs) + ':' + p(m);
    const spoken = hrs + ' שעות ו־' + m + ' דקות';
    const urgent = t < 3600;
    const gold = 'linear-gradient(135deg, #B8901F 0%, #E8C65A 28%, #FFF1B8 48%, #E2BD48 68%, #B8901F 100%)';
    return {
      label: label,
      ariaLabel: 'המחזור מתחיל בעוד ' + spoken + '. מעבר למשחק הבא לניחוש',
      fabStyle: urgent
        ? 'background: ' + gold + '; border-color: #8A6A12;'
        : 'background: linear-gradient(#123F24, #123F24) padding-box, ' + gold + ' border-box;',
      icStyle: urgent ? 'background: #2A2005; color: #FFE9A8;' : 'background: ' + gold + '; color: #2A2005;',
      capColor: urgent ? '#4A3600' : '#B9D3C1',
      timeColor: urgent ? '#2A2005' : '#F7F5EC'
    };
  }
}
</script>
